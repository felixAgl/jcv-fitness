# Daily bilingual exercise Reel — generates a 1080x1920 MP4 + caption from the
# exercise library and uploads them as a workflow artifact (30-day retention).
#
# Publishing to Instagram is OPTIONAL and gated behind the repo secrets
# IG_USER_ID / IG_ACCESS_TOKEN. Without them the publish step prints setup
# instructions and exits 0 ("GENERATED ONLY") — the workflow never fails.
#
# LICENSE GATE: exercise media is (c) Gymvisual. Do NOT add the IG secrets
# until the owner's Gymvisual license is finalized; until then the trainer
# downloads the artifact and posts manually.
#
# STATE: the "already used" tracker persists via actions/cache (NOT a git push
# to main — main is a protected branch and rejects direct pushes). The reel is
# uploaded BEFORE any state handling so a cache miss/failure never loses it.
name: Daily Reel

on:
  schedule:
    - cron: "0 16 * * *" # 11:00 Colombia (UTC-5)
  workflow_dispatch:
    inputs:
      exercise_id:
        description: "Exercise id (e.g. 0043). Leave empty for the deterministic daily pick."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Restore the used-ids tracker from cache so daily picks don't repeat over
      # the full cycle. A miss just starts fresh — date-seeding still varies the
      # daily pick regardless.
      - name: Restore used-ids cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/reels/used-ids.json
          key: reels-used-ids-${{ github.run_id }}
          restore-keys: |
            reels-used-ids-

      - name: Compose reel
        id: compose
        run: |
          SEED=$(date -u +%F)
          EXERCISE="${{ github.event.inputs.exercise_id }}"
          node scripts/reels/compose-reel.mjs "${EXERCISE:-random}" --seed "$SEED" --mark-used
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          echo "video=$(ls reels-out/*.mp4 | head -1)" >> "$GITHUB_OUTPUT"
          echo "caption=$(ls reels-out/*.txt | head -1)" >> "$GITHUB_OUTPUT"

      # Upload FIRST so the reel is always available, even if later steps fail.
      - name: Upload reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.compose.outputs.seed }}
          path: |
            reels-out/*.mp4
            reels-out/*.txt
          retention-days: 30
          if-no-files-found: error

      # Persist the updated tracker for the next run. Non-fatal.
      - name: Save used-ids cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: scripts/reels/used-ids.json
          key: reels-used-ids-${{ github.run_id }}

      # No-op without secrets: prints IG setup instructions and exits 0.
      - name: Publish to Instagram (gated)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node scripts/reels/publish-reel.mjs \
            --video "${{ steps.compose.outputs.video }}" \
            --caption "${{ steps.compose.outputs.caption }}"
