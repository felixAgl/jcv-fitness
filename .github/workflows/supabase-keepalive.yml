name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 12 */2 * *"  # every 2 days at noon UTC
  workflow_dispatch:         # manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://chqgylghpuzcqzkbuhsk.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNocWd5bGdocHV6Y3F6a2J1aHNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjY0MjUsImV4cCI6MjA4NTIwMjQyNX0.1WJMdvmtBjuakkhInJc62r5hyYFoLzwkDhv8Kny4NUE")
          echo "Supabase ping: HTTP $STATUS"
          [ "$STATUS" -ge 100 ] && [ "$STATUS" -lt 500 ] && echo "OK" || exit 1
