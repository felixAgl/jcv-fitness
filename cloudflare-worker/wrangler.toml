name = "mercadopago-jcv"
main = "mercadopago-worker.js"
compatibility_date = "2024-01-01"

[triggers]
# Every 30 min: payment reconciliation sweep + Supabase keep-alive ping
crons = ["*/30 * * * *"]

# Environment variables (secrets should be set via wrangler secret put)
# MP_ACCESS_TOKEN - MercadoPago Access Token (TEST or PROD)
# SUPABASE_URL - Supabase project URL
# SUPABASE_SERVICE_KEY - Supabase service role key

# =============================================================================
# STAGING ENVIRONMENT
# =============================================================================
# Deploy with: wrangler deploy --env staging
# Worker URL: mercadopago-jcv-staging.fagal142010.workers.dev
# Supabase: jcv-fitness-staging (bqfkyknswklzlxkhebiy)
# =============================================================================
[env.staging]
name = "mercadopago-jcv-staging"

# =============================================================================
# PRODUCTION ENVIRONMENT (default)
# =============================================================================
# Deploy with: wrangler deploy
# Worker URL: mercadopago-jcv.fagal142010.workers.dev
# Supabase: felixAgl's Project (chqgylghpuzcqzkbuhsk)
# =============================================================================

