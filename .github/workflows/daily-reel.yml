# Daily bilingual exercise Reel — generates a 1080x1920 MP4 + caption from the
# exercise library and uploads them as a workflow artifact (30-day retention).
#
# Publishing to Instagram is OPTIONAL and gated behind the repo secrets
# IG_USER_ID / IG_ACCESS_TOKEN. Without them the publish step prints setup
# instructions and exits 0 ("GENERATED ONLY") — the workflow never fails.
#
# LICENSE GATE: exercise media is (c) Gymvisual. Do NOT add the IG secrets
# until the owner's Gymvisual license is finalized; until then the trainer
# downloads the artifact and posts manually.
name: Daily Reel

on:
  schedule:
    - cron: "0 16 * * *" # 11:00 Colombia (UTC-5)
  workflow_dispatch:
    inputs:
      exercise_id:
        description: "Exercise id (e.g. 0043). Leave empty for the deterministic daily pick."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Compose reel
        id: compose
        run: |
          SEED=$(date -u +%F)
          EXERCISE="${{ github.event.inputs.exercise_id }}"
          node scripts/reels/compose-reel.mjs "${EXERCISE:-random}" --seed "$SEED" --mark-used
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          echo "video=$(ls reels-out/*.mp4 | head -1)" >> "$GITHUB_OUTPUT"
          echo "caption=$(ls reels-out/*.txt | head -1)" >> "$GITHUB_OUTPUT"

      - name: Commit used-ids tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/reels/used-ids.json
          if git diff --cached --quiet; then
            echo "No used-ids change to commit"
          else
            git commit -m "chore(reels): track used exercise for ${{ steps.compose.outputs.seed }} [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      - name: Upload reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.compose.outputs.seed }}
          path: |
            reels-out/*.mp4
            reels-out/*.txt
          retention-days: 30
          if-no-files-found: error

      # No-op without secrets: prints IG setup instructions and exits 0.
      - name: Publish to Instagram (gated)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node scripts/reels/publish-reel.mjs \
            --video "${{ steps.compose.outputs.video }}" \
            --caption "${{ steps.compose.outputs.caption }}"
